model_list:
  - model_name: claude
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: local
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://ollama:11434

litellm_settings:
  fallbacks:
    - claude: ["local"]
