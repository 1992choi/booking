server:
  port: 8080

spring:
  application:
    name: api
  datasource:
    url: jdbc:mysql://localhost:3306/api_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

booking:
  jwt:
    secret: ${BOOKING_JWT_SECRET:dev-secret-must-be-at-least-32-bytes-long-for-hmac-sha256}
    access-token-ttl: PT1H
  reservation:
    base-url: ${RESERVATION_BASE_URL:http://localhost:8081}