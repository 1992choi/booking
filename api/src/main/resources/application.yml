server:
  port: 8080

spring:
  application:
    name: api
  datasource:
    url: jdbc:mysql://localhost:3306/db_api?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

booking:
  jwt:
    secret: ${BOOKING_JWT_SECRET:dev-secret-must-be-at-least-32-bytes-long-for-hmac-sha256}
    access-token-ttl: PT1H
    refresh-token-ttl: P30D